# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - main
  - azure-pipelines 
 
resources:
  - repo: self
 
variables:
  tag: '$(Build.BuildId)'
  frontendImage: 'admin-dashboard-pfe'
  backendImage: 'backend-commercial'
 
stages:
- stage: Build
  displayName: Build images
  jobs:
  - job: Build
    displayName: Build Docker Images
    pool:
      vmImage: ubuntu-latest
    steps:
      # Build Frontend
      - task: Docker@2  
        displayName: 'Build Frontend Image'
        inputs:
          command: build
          repository: $(frontendImage)
          Dockerfile: 'Dockerfile'
          buildContext: 'admin-dashboard-pfe'
          tags: |
            latest
            $(tag)
 
      # Build Backend
      - task: Docker@2
        displayName: 'Build Backend Image'
        inputs:
          command: build
          repository: $(backendImage)
          Dockerfile: 'Dockerfile'
          buildContext: 'backend-commercial'
          tags: |
            latest
            $(tag)